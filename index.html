<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Cities</title>
<style>
  :root { --bg: #ffffff; --card: #f4f5f7; --ink: #0e0f12; --mute: #5b6270; --line: rgba(14,15,18,.14); --accent: #3355ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  header { max-width: 1200px; margin: 0 auto; padding: 48px 20px 20px; }
  h1 { font: 500 clamp(36px, 6vw, 64px)/1.05 Georgia, serif; letter-spacing: -.02em; margin: 0; }
  h1 em { color: var(--accent); }
  header p { color: var(--mute); max-width: 60ch; margin: 12px 0 0; }
  main { max-width: 1200px; margin: 0 auto; padding: 0 20px 64px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); gap: 20px; }
  a.card { display: block; text-decoration: none; color: inherit; border: 2px solid var(--ink); border-radius: 14px; overflow: hidden; background: var(--bg); }
  a.card:hover, a.card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  a.card img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
  .meta { padding: 12px 16px 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-top: 2px solid var(--ink); }
  .meta h2 { margin: 0; font: 500 26px/1.1 Georgia, serif; }
  .meta span { font-size: 13px; color: var(--mute); text-align: right; }
</style>
</head>
<body>
<header>
  <h1>World <em>Cities</em></h1>
  <p>Five cities as living isometric miniatures, drawn and animated in code. Open one to watch it run.</p>
</header>
<main id="grid"></main>
<script>
const cities = [
  { id: "tokyo", name: "Tokyo", note: "Senso-ji · Shibuya · Tokyo Tower · Shinkansen" },
  { id: "london", name: "London", note: "Big Ben · Tower Bridge · London Eye · the Palace" },
  { id: "paris", name: "Paris", note: "Eiffel Tower · Louvre · Notre-Dame · Montmartre" },
  { id: "dubai", name: "Dubai", note: "Burj Khalifa · Burj Al Arab · the Palm · the Frame" },
  { id: "shanghai", name: "Shanghai", note: "Oriental Pearl · the Bund · Yu Garden · Maglev" },
];
const grid = document.getElementById("grid");
for (const c of cities) grid.insertAdjacentHTML("beforeend", `<a class="card" href="city.html?city=${c.id}"><img src="docs/img/${c.id}.jpg" alt="${c.name}, the whole city" loading="lazy"><div class="meta"><h2>${c.name}</h2><span>${c.note}</span></div></a>`);
</script>
</body>
</html>
